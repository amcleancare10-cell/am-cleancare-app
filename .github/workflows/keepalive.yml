# Mantém o projeto Supabase ATIVO (o plano gratuito pausa após ~7 dias sem atividade).
# Corre sozinho de 2 em 2 dias e faz um pedido simples à API pública (a chave "anon" é pública por desenho).
name: Manter Supabase ativo
on:
  schedule:
    - cron: '17 6 */2 * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Pedido à API
        run: |
          for i in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" "https://uxxjvwvqhaeepmmdkior.supabase.co/rest/v1/login_view?select=user_id&limit=1" -H "apikey: https://uxxjvwvqhaeepmmdkior.supabase.co" -H "Authorization: Bearer https://uxxjvwvqhaeepmmdkior.supabase.co")
            echo "tentativa $i: HTTP $code"
            if [ "$code" = "200" ] || [ "$code" = "206" ]; then exit 0; fi
            sleep 20
          done
          exit 1
